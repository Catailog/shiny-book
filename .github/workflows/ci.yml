name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run type-check

      - run: npm test

      - run: npm run build
